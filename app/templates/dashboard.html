{% extends "_base.html" %}

{% block title %}Dashboard de Asistencia{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Dashboard</h1>
    </div>

    <!-- Tarjetas de Estadísticas Principales -->
    <div class="row">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3">
                <div class="card-header">Total de Registros</div>
                <div class="card-body">
                    <h5 class="card-title" id="total-registrations">Cargando...</h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-header">Total de Asistencia</div>
                <div class="card-body">
                    <h5 class="card-title" id="total-attendance">Cargando...</h5>
                </div>
            </div>
        </div>
    </div>

    <!-- Gráficas -->
    <div class="row">
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header">Registros por Tipo de Persona</div>
                <div class="card-body">
                    <canvas id="registrations-by-type-chart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header">Asistencia por Tipo de Persona</div>
                <div class="card-body">
                    <canvas id="attendance-by-type-chart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Guardar instancias de las gráficas para poder actualizarlas
        let registrationsChart, attendanceChart;

        function updateDashboard() {
            fetch('/api/dashboard/stats')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('La respuesta de la red no fue exitosa');
                    }
                    return response.json();
                })
                .then(data => {
                    // 1. Actualizar tarjetas de totales
                    document.getElementById('total-registrations').innerText = data.total_registrations;
                    document.getElementById('total-attendance').innerText = data.total_attendance;

                    // 2. Actualizar o crear la gráfica de Registros por Tipo
                    const regLabels = Object.keys(data.registrations_by_type);
                    const regData = Object.values(data.registrations_by_type);
                    if (registrationsChart) {
                        registrationsChart.data.labels = regLabels;
                        registrationsChart.data.datasets[0].data = regData;
                        registrationsChart.update();
                    } else {
                        registrationsChart = new Chart(document.getElementById('registrations-by-type-chart'), {
                            type: 'doughnut',
                            data: {
                                labels: regLabels,
                                datasets: [{
                                    label: 'Registros',
                                    data: regData,
                                    backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545', '#6c757d'],
                                }]
                            }
                        });
                    }

                    // 3. Actualizar o crear la gráfica de Asistencia por Tipo
                    const attLabels = Object.keys(data.attendance_by_type);
                    const attData = Object.values(data.attendance_by_type);
                    if (attendanceChart) {
                        attendanceChart.data.labels = attLabels;
                        attendanceChart.data.datasets[0].data = attData;
                        attendanceChart.update();
                    } else {
                        attendanceChart = new Chart(document.getElementById('attendance-by-type-chart'), {
                            type: 'pie',
                            data: {
                                labels: attLabels,
                                datasets: [{
                                    label: 'Asistencia',
                                    data: attData,
                                    backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545', '#6c757d'],
                                }]
                            }
                        });
                    }
                })
                .catch(error => {
                    console.error('Error al obtener los datos del dashboard:', error);
                    // Opcional: mostrar un error en la UI
                    document.getElementById('total-registrations').innerText = 'Error';
                    document.getElementById('total-attendance').innerText = 'Error';
                });
        }

        // Llamada inicial para cargar los datos inmediatamente
        updateDashboard();
        
        // Actualizar el dashboard cada 5 segundos
        setInterval(updateDashboard, 5000);
    });
</script>
{% endblock %}
